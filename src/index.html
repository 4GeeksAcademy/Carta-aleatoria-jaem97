<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./assets/img/4geeks.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta aleatoria</title>

  <!-- Fontawesome is our recomended library for icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-success d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">

  <div class="card p-3 mb-4 shadow-sm bg-light" style="max-width: 500px; width: 100%;">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-sm-4">
        <label for="card-width" class="form-label small fw-bold">Ancho (px):</label>
        <input type="number" id="card-width" class="form-control" value="300" min="150" max="600">
      </div>
      <div class="col-6 col-sm-4">
        <label for="card-height" class="form-label small fw-bold">Alto (px):</label>
        <input type="number" id="card-height" class="form-control" value="450" min="225" max="900">
      </div>
      <div class="col-12 col-sm-4">
        <button id="new-card-btn" class="btn btn-dark w-100 fw-bold">Generar</button>
      </div>
    </div>
  </div>

  <div id="poker-card" class="poker-card bg-white rounded-4 shadow-lg d-flex flex-column justify-content-between p-3">
    <div class="top-suit align-self-start"></div>
    <div class="card-number align-self-center fw-bold"></div>
    <div class="bottom-suit align-self-end text-end"></div>
  </div>

  <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
  <script type="module" src="/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
